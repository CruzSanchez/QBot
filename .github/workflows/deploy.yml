name: Deploy to server

# Runs on the self-hosted runner installed on the DownloadBot server itself.
# Requires a repository variable SERVER_REPO_PATH set to the absolute path of
# this repo's clone on that machine (Settings -> Secrets and variables ->
# Actions -> Variables). See CLARIFICATIONS.md for the one-time runner setup.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest main
        shell: pwsh
        run: |
          Set-Location "${{ vars.SERVER_REPO_PATH }}"
          git fetch origin
          git reset --hard origin/main

      # Has to stop the running bot before building — dotnet run's own build keeps
      # DownloadBot.exe open, so rebuilding in place while it's still running fails
      # with a file-lock error (MSB3027/MSB3021). Downtime is brief either way.
      # On Windows, `dotnet run` execs the built apphost directly, so the actual
      # running process is named DownloadBot.exe, not dotnet.exe — kill both names
      # to cover it regardless of how it was last started.
      - name: Stop DownloadBot
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -in @('DownloadBot.exe', 'dotnet.exe') -and $_.CommandLine -like "*DownloadBot*" } |
            ForEach-Object {
              Write-Host "Stopping $($_.Name) PID $($_.ProcessId)"
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          Start-Sleep -Seconds 2

      - name: Build
        shell: pwsh
        run: |
          Set-Location "${{ vars.SERVER_REPO_PATH }}\DownloadBot"
          dotnet build -c Release

      - name: Start DownloadBot
        shell: pwsh
        run: schtasks /run /tn "DownloadBot"
