name: Deploy to server

# Runs on the self-hosted runner installed on the DownloadBot server itself.
# Requires a repository variable SERVER_REPO_PATH set to the absolute path of
# this repo's clone on that machine (Settings -> Secrets and variables ->
# Actions -> Variables). See CLARIFICATIONS.md for the one-time runner setup.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest main
        shell: pwsh
        run: |
          Set-Location "${{ vars.SERVER_REPO_PATH }}"
          git fetch origin
          git reset --hard origin/main

      # Has to stop the running bot before building — dotnet run's own build keeps
      # DownloadBot.exe open, so rebuilding in place while it's still running fails
      # with a file-lock error (MSB3027/MSB3021). Downtime is brief either way.
      #
      # A scheduled-task process has no window/console message loop, so plain
      # `taskkill` (no /F) just refuses with "can only be forced" instead of
      # actually asking it to close — and Stop-Process -Force skips the host's
      # ApplicationStopping hook entirely (no "Bot shutting down" Discord message).
      # POSTing /shutdown runs that same graceful-shutdown path Ctrl+C would.
      # Only force-kills the process if it's still alive after giving it time to
      # exit on its own.
      - name: Stop DownloadBot
        shell: pwsh
        run: |
          try {
            Invoke-RestMethod -Method Post -Uri "http://localhost:5151/shutdown" -TimeoutSec 5 | Out-Null
          } catch {
            Write-Host "Could not reach /shutdown (bot may already be down): $($_.Exception.Message)"
          }

          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Date) -lt $deadline) {
            $stillRunning = Get-CimInstance Win32_Process |
              Where-Object { $_.Name -in @('DownloadBot.exe', 'dotnet.exe') -and $_.CommandLine -like "*DownloadBot*" }
            if (-not $stillRunning) { break }
            Start-Sleep -Seconds 1
          }

          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -in @('DownloadBot.exe', 'dotnet.exe') -and $_.CommandLine -like "*DownloadBot*" } |
            ForEach-Object {
              Write-Host "Still running — force-stopping $($_.Name) PID $($_.ProcessId)"
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }

      - name: Build
        shell: pwsh
        run: |
          Set-Location "${{ vars.SERVER_REPO_PATH }}\DownloadBot"
          dotnet build -c Release

      - name: Start DownloadBot
        shell: pwsh
        run: schtasks /run /tn "DownloadBot"
